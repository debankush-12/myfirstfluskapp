<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Companies | Admin</title>
    <style>
        :root { 
            --primary: #4f46e5;
            --success: #10b981; 
            --bg: #f8fafc; 
            --white: #ffffff;     
        }
        body { 
            font-family: system-ui, 
            sans-serif; background: 
            var(--bg); margin: 0; 
        }
        nav { 
            background: var(--white); 
            padding: 1rem 2rem; 
            border-bottom: 1px solid #e2e8f0; 
            display: flex; 
            justify-content: space-between; 
        }
        .container { max-width: 1000px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        table { 
            width: 100%; background: var(--white); 
            border-collapse: collapse; border-radius: 0.75rem; 
            overflow: hidden; border: 1px solid #e2e8f0; 
        }
        th { 
            background: #f1f5f9; 
            padding: 1rem; 
            text-align: left; 
            font-size: 0.875rem; 
            color: #64748b; 
        }
        td { 
            padding: 1rem; 
            border-top: 1px solid #e2e8f0; 
        }
        .btn-approve { 
            background: var(--success); 
            color: white; 
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem; 
            text-decoration: none; 
            font-size: 0.8rem; 
            font-weight: 600; 
        }
        .status-badge { 
            padding: 0.2rem 0.5rem; 
            border-radius: 99px; 
            font-size: 0.75rem; 
            font-weight: 600; 
        }
        .pending { 
            background: #fef3c7; 
            color: #92400e; 
        }
        .approved { 
            background: #dcfce7; 
            color: #166534; 
        }
    </style>
</head>
<body>
    <nav>
        <div style="font-weight: 800;">Admin<span>Panel</span></div>
        <a href="{{ url_for('admin_home') }}" style="text-decoration: none; color: var(--primary);">Home</a>
    </nav>
    <div class="container">
        <h2>Registered Companies</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for company in companies %}
                <tr>
                    <td>{{ company.name }}</td>
                    <td>{{ company.email }}</td>
                    <td>
                        {% if company.approved %}
                        <span class="status-badge approved">Approved</span>
                        {% else %}
                        <span class="status-badge pending">Pending</span>
                        {% endif %}
                    </td>
                    <td>
                        {% if not company.approved %}
                        <a href="{{ url_for('approve_company', cid=company.id) }}" class="btn-approve">Approve</a>
                        {% else %}
                        -
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
