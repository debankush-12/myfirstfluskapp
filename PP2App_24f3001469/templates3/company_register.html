<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration | CareerConnect</title>
    <style>
        :root {
            --primary: #059669;
            --bg: #f8fafc;
            --text: #1e293b;
            --white: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .reg-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid #e2e8f0;
        }

        h1 { color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
        p { text-align: center; color: #64748b; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.4rem; }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
        }

        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <div class="reg-card">
        <h1>Partner With Us</h1>
        <p>Register your company to start hiring talent.</p>

        <form method="POST">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" name="name" placeholder="Acme Corp" required>
            </div>
            <div class="form-group">
                <label>Official Email</label>
                <input type="email" name="email" placeholder="hr@acme.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Create Account</button>
        </form>

        <div class="footer">
            Already registered? <a href="{{ url_for('company_login') }}">Login here</a>
        </div>
    </div>

</body>
</html>
