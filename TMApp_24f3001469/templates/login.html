<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #eef3fc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 500px;
        }
        .card { 
            background: white; 
            padding: 50px; 
            border-radius: 6px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 320px; 
            
        }
        h3 { 
             
            margin-top: 0; 
            color: #333; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            
        }
        button:hover { 
            background: #083b72; 
        }
        .link { 
            text-align: center; 
            display: block; 
            margin-top: 15px; 
            color: #8000f7; 
            text-decoration: none; 
        }
    </style>
</head>
<body>
    <div class="card">
        <center><h2>Login</h2></center>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/register" class="link">Create Account</a>
    </div>
</body>
</html>
