<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #f3fcf4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 500px; 
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 6px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 320px; 
        }
        h3 { 
            text-align: center; 
            margin-top: 0; 
            color: #333; 
        }
        input, select { 
            width: 100%; padding: 10px; 
            margin-bottom: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; padding: 10px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { 
            background: #218838; 
        }
        .link { 
            text-align: center; 
            display: block; 
            margin-top: 15px; 
            color: #2a28a7; 
            text-decoration: none; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Register</h3>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="text" name="contact" placeholder="Contact details" required>
            <select name="role">
                <option value="user">Trekker</option>
                <option value="staff">Staff</option>
            </select>
            <button type="submit">Register</button>
        </form>
        <a href="/login" class="link">Login Instead</a>
    </div>
</body>
</html>
