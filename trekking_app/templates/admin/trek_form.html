{% extends "base.html" %}
{% block title %}{% if trek %}Edit Trek{% else %}Add Trek{% endif %}{% endblock %}

{% block content %}
<h3 class="mb-4">{% if trek %}Edit Trek: {{ trek.name }}{% else %}Add New Trek{% endif %}</h3>

<div class="card p-4">
    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Trek Name</label>
                <input type="text" class="form-control" name="name" required
                       value="{{ trek.name if trek else '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" name="location" required
                       value="{{ trek.location if trek else '' }}">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Difficulty</label>
                <select class="form-select" name="difficulty" required>
                    {% for level in ['Easy', 'Moderate', 'Hard'] %}
                    <option value="{{ level }}" {% if trek and trek.difficulty == level %}selected{% endif %}>{{ level }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Duration (days)</label>
                <input type="number" min="1" class="form-control" name="duration" required
                       value="{{ trek.duration if trek else '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Total Slots</label>
                <input type="number" min="1" class="form-control" name="total_slots" required
                       value="{{ trek.total_slots if trek else '' }}">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" class="form-control" name="start_date" required
                       value="{{ trek.start_date if trek else '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" name="end_date" required
                       value="{{ trek.end_date if trek else '' }}">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Assign Staff</label>
                <select class="form-select" name="assigned_staff_id">
                    <option value="">-- Not Assigned --</option>
                    {% for staff in staff_list %}
                    <option value="{{ staff.id }}"
                        {% if trek and trek.assigned_staff_id == staff.id %}selected{% endif %}>
                        {{ staff.name }} (ID: {{ staff.id }})
                    </option>
                    {% endfor %}
                </select>
                <div class="form-text">Only approved staff members appear here.</div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status" required>
                    {% for st in ['Pending', 'Approved', 'Open', 'Ongoing', 'Closed', 'Completed'] %}
                    <option value="{{ st }}" {% if trek and trek.status == st %}selected{% endif %}>{{ st }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3">{{ trek.description if trek else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">{% if trek %}Save Changes{% else %}Create Trek{% endif %}</button>
        <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
