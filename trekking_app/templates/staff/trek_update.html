{% extends "base.html" %}
{% block title %}Update Trek{% endblock %}

{% block content %}
<h3 class="mb-4">Update Trek: {{ trek.name }}</h3>

<div class="card p-4" style="max-width: 500px;">
    <p><b>Location:</b> {{ trek.location }}</p>
    <p><b>Difficulty:</b> {{ trek.difficulty }}</p>
    <p><b>Total Slots:</b> {{ trek.total_slots }}</p>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Available Slots</label>
            <input type="number" min="0" max="{{ trek.total_slots }}" class="form-control"
                   name="available_slots" value="{{ trek.available_slots }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Trek Status</label>
            <select class="form-select" name="status" required>
                {% for st in ['Open', 'Ongoing', 'Closed', 'Completed'] %}
                <option value="{{ st }}" {% if trek.status == st %}selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
